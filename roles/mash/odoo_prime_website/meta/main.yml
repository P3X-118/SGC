---
galaxy_info:
  author: Oneill
  company: SGC
  role_name: odoo_prime_website
  namespace: SGC
  description: |
    Installs the prime_website Odoo module — the public Prime Baseball marketing
    website (brand theme, native-snippet pages, nav/footer, program pages, store
    products, host-aware "/" controller) on the prime.i.legit.services Odoo.
    Same install pattern as mash/odoo_ghostrak: rsync source from controller,
    then run a one-shot docker container that mirrors the running systemd unit's
    mounts/network/add-host to do -i/-u prime_website --stop-after-init.
  license: MIT
  min_ansible_version: "2.10"
  platforms:
    - name: Debian
      versions: [all]
    - name: Ubuntu
      versions: [all]
