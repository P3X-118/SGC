---
- name: Stop and disable legit-services systemd unit
  ansible.builtin.service:
    name: "{{ legit_services_identifier }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Bring compose project down
  community.docker.docker_compose_v2:
    project_src: "{{ legit_services_base_path }}"
    state: absent
  failed_when: false

- name: Remove systemd unit
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ legit_services_identifier }}.service"
    state: absent

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Remove legit-services base path (preserves data only if archived)
  ansible.builtin.file:
    path: "{{ legit_services_base_path }}"
    state: absent
  when: legit_services_uninstall_wipe_data | default(false) | bool
