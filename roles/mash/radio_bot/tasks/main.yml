---
# radio_bot -- install + manage the radio-cooey bot container as a systemd
# unit (mirrors the hand-managed okast unit pattern on the same hosts).

- name: Ensure base path exists
  ansible.builtin.file:
    path: "{{ radio_bot_base_path }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: radio_bot_enabled | bool

- name: Render the env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ radio_bot_base_path }}/env"
    owner: root
    group: root
    mode: '0600'
  when: radio_bot_enabled | bool
  notify: restart radio_bot

- name: Render config.json
  ansible.builtin.copy:
    content: "{{ radio_bot_configuration | to_nice_json }}\n"
    dest: "{{ radio_bot_base_path }}/config.json"
    owner: root
    group: root
    mode: '0644'
  when: radio_bot_enabled | bool
  notify: restart radio_bot

- name: Pull the container image
  community.docker.docker_image:
    name: "{{ radio_bot_image }}"
    source: pull
  when: radio_bot_enabled | bool

- name: Render the systemd unit
  ansible.builtin.template:
    src: radio_bot.service.j2
    dest: "/etc/systemd/system/{{ radio_bot_identifier }}.service"
    owner: root
    group: root
    mode: '0644'
  when: radio_bot_enabled | bool
  notify: reload systemd

- name: Ensure the bot is enabled and running
  ansible.builtin.systemd:
    name: "{{ radio_bot_identifier }}.service"
    state: started
    enabled: true
    daemon_reload: true
  when: radio_bot_enabled | bool

- name: Stop the bot when disabled
  ansible.builtin.systemd:
    name: "{{ radio_bot_identifier }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false
  when: not (radio_bot_enabled | bool)

- name: Remove the systemd unit when disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ radio_bot_identifier }}.service"
    state: absent
  when: not (radio_bot_enabled | bool)
  notify: reload systemd
