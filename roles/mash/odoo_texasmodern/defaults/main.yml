---
# odoo_texasmodern — Odoo-side provisioning for Texas Modern Waste, modelled on
# odoo_learningwell. Reproducible/idempotent so the integration can be recreated
# on a fresh or migrated Odoo:
#   1. the TMW service products (TMW-CART / TMW-CLEAN / TMW-VALET) that intake
#      sale.order lines reference,
#   2. the `texasmodern-service` JSON-RPC user (Sales, default company = Texas
#      Modern Waste), password DERIVED from this Odoo host's sgc_pgsk — the TMW
#      intake app host re-derives the same value via cross-host hostvars.
#
# UNLIKE odoo_learningwell, this role does NOT create the company (Texas Modern
# Waste is a managed company created by odoo_sgc_companies) and does NOT install
# modules (sale_management/crm/product are already installed by odoo_learningwell
# in this shared Odoo) — so it runs with ZERO downtime, one-shot shells only.
#
# Runs on the host that owns the Odoo deployment (the `odoo` VM). Enable per-host
# in host_vars/odoo/vars.yml:  odoo_texasmodern_enabled: true
# Then:  just install-service odoo_texasmodern --limit odoo

odoo_texasmodern_enabled: false

# Odoo database (the `do` role's per-service DB on this host).
odoo_texasmodern_database_name: "{{ do_database_name | default('sgc-do') }}"

# The managed company (created by odoo_sgc_companies; referenced by name here).
odoo_texasmodern_company_name: "Texas Modern Waste"

# --- Service products (sale.order lines reference them by default_code) ------
odoo_texasmodern_provision_products: true
odoo_texasmodern_products:
  - { code: "TMW-CART", name: "Trash Cart Service (weekly)" }
  - { code: "TMW-CLEAN", name: "Cart Cleaning (quarterly)" }
  - { code: "TMW-VALET", name: "Valet Trash Service" }

# --- Service user (the app authenticates as this over JSON-RPC) -------------
odoo_texasmodern_provision_service_user: true
odoo_texasmodern_service_user_login: "texasmodern-service"
odoo_texasmodern_service_user_name: "Texas Modern Waste (service account)"
# Derived from THIS odoo host's sgc_pgsk; the TMW app host re-derives the same
# value (hostvars['odoo'].sgc_pgsk). No operator hand-off — same as the
# odoo_learningwell learningwell-service pattern.
odoo_texasmodern_service_user_password: "{{ ((sgc_pgsk | default('')) ~ '.odoo.texasmodern') | hash('sha256') }}"
# Odoo groups granting create on res.partner + sale.order + crm.lead (signups
# are mirrored as leads). Missing xmlids are skipped by the script (defensive
# across Odoo editions).
odoo_texasmodern_service_user_groups:
  - base.group_user
  - sales_team.group_sale_salesman
  - sales_team.group_sale_salesman_all_leads

# --- One-shot docker-run plumbing (mirrors odoo_learningwell; defaults match
#     the `do` role's systemd unit on the odoo host) -----------------------
odoo_texasmodern_install_do_base_path: "{{ do_base_path | default('/' ~ (sgc_playbook_identifier | default('sgc-do')) ~ '/' ~ (do_identifier | default('do'))) }}"
odoo_texasmodern_install_do_image: "sgc-do:{{ do_version | default('19.0') }}-{{ do_image_release | default('01') }}"
# DB-only network — the shell short-circuits HTTP with --no-http. The postgres
# container/network on the odoo host is `sgc-postgres`.
odoo_texasmodern_install_network: "sgc-postgres"
odoo_texasmodern_install_user: "{{ (sgc_playbook_uid | default(999)) ~ ':' ~ (sgc_playbook_gid | default(988)) }}"
# Optional --add-host entries (the ORM provisioning needs no OIDC reachability).
odoo_texasmodern_install_add_hosts: []
