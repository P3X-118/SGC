---
# odoo_ghostrak — provisions Odoo-side state needed for ghostrak's two-tier
# auth: the `groups` OIDC scope on the auth_oauth_provider record (so Odoo
# asks Authentik for the claim, which the authentik_ghostrak role provisions
# on the issuer side). Later concerns (when they land) will also live here:
#   - the custom `ghostrak` Odoo addon's data/UI/sync layer (seam #3),
#   - the BFF webhook the addon calls on coach-assignment writes.
#
# Runs on the host that owns the Odoo deployment (e.g. prime.i.legit.services).
# Idempotent — re-runs are no-ops once the desired state is in place.
#
# Enable per-host in host_vars/<host>/vars.yml:
#   odoo_ghostrak_enabled: true
# Then: `just install-service odoo_ghostrak --limit <host>`.

odoo_ghostrak_enabled: false

# Container names. Defaults match the SGC convention for prime
# (service_id_prefix=prime-); override per host when prefixes differ.
odoo_ghostrak_postgres_container: prime-postgres

# Postgres role + database owning the Odoo schema. The default galaxy/postgres
# bootstrap creates a per-service role/db named `<prefix>do` (so on prime
# both are `prime-do`).
odoo_ghostrak_database_user: prime-do
odoo_ghostrak_database_name: prime-do

# ---------------------------------------------------------------------------
# OIDC groups-scope on auth_oauth_provider
#
# Appends `groups` to the scope column of the Authentik provider record in
# auth_oauth_provider so Odoo's auth_oauth requests the claim at login. The
# Authentik-side ScopeMapping (`ghostrak: groups scope`) provisioned by
# mash/authentik_ghostrak emits the claim once it's requested.
#
# No Odoo restart required — the auth_oauth module reads provider config on
# each login flow, so the change takes effect immediately.
# ---------------------------------------------------------------------------
odoo_ghostrak_provision_oidc_groups_scope: true

# Match the provider by client_id (the OAuth2 app's id in Authentik, also
# the client_id Odoo's auth_oauth saved into its DB row). For prime this is
# `prime` (set by provision-prime.py and visible in auth_oauth_provider).
odoo_ghostrak_oidc_client_id: prime

# Scopes to ensure are present in the auth_oauth_provider.scope column.
# `openid` is implicit in auth_oauth's protocol layer; the rest must appear
# in the column verbatim (space-separated) so Odoo includes them in its
# authorization request to Authentik.
odoo_ghostrak_oidc_required_scopes:
  - groups


# ---------------------------------------------------------------------------
# Custom `ghostrak` Odoo addon — installation + sync
#
# Rsyncs the addon source from the controller into the host's
# do_extra_addons_path (mounted into the Odoo container at /mnt/extra-addons),
# then runs `docker compose run --rm` to install or upgrade the module. The
# compose-run pattern reuses the deploying Odoo container's image, volumes,
# env, network, and host overrides — so the install sees the same DB/userinfo
# routing as the running service without us having to re-encode any of it.
#
# Brief downtime: the running prime-do service is stopped for the install
# (releasing the DB lock); systemctl start brings it back. Skipped when the
# addon source on the host already matches the controller (rsync changed=0).
# ---------------------------------------------------------------------------
odoo_ghostrak_install_addon: true

odoo_ghostrak_addon_module_name: ghostrak

# Absolute path on the CONTROLLER. Default points at the main ghostrak
# working tree; overridable per host (e.g. point at the ghostrak-prod
# worktree for prod-pinned deploys).
odoo_ghostrak_addon_src_path: "/home/oneill/apps/ghostrak/odoo-addon/{{ odoo_ghostrak_addon_module_name }}"

# Target on the HOST. Defaults to {{ do_extra_addons_path }}/{{ module name }}
# which on the standard do role layout is /<identifier>/<identifier>-do/
# extra-addons/<module>. mash/do must have do_extra_addons_enabled: true so
# Odoo picks the dir up via its addons_path.
odoo_ghostrak_addon_dst_path: "{{ do_extra_addons_path | default('/' ~ (do_identifier | default('do')) ~ '/extra-addons') }}/{{ odoo_ghostrak_addon_module_name }}"

# The systemd unit + paths + docker args used to run the one-shot install.
# Defaults mirror what the SGC do role's `docker create` invocation puts in
# /etc/systemd/system/<do_identifier>.service — same image, same mounts,
# same networks, same hardening. The host runs raw `docker run/create/start`
# (NOT docker-compose), so we can't use `docker compose run`.
#
# Standard SGC layout: do_base_path = /<sgc_playbook_identifier>/<do_identifier>
# (e.g. /prime/prime-do). do_base_path is set by mash/do role's defaults.
odoo_ghostrak_systemd_service: "{{ (do_identifier | default('do')) ~ '.service' }}"
odoo_ghostrak_install_do_base_path: "{{ do_base_path | default('/' ~ (sgc_playbook_identifier | default('do')) ~ '/' ~ (do_identifier | default('do'))) }}"

# Image tag — must match what the systemd unit runs (otherwise the install
# would run a different code than the long-running service).
odoo_ghostrak_install_do_image: "sgc-do:{{ do_image_version | default('19.0') }}-{{ do_image_release | default('01') }}"

# For postgres connectivity only — the install short-circuits HTTP with
# --no-http, so the prime-do main network + traefik aren't needed.
odoo_ghostrak_install_network: "{{ (sgc_playbook_identifier | default('do')) ~ '-postgres' }}"

# Optional extra-hosts entries (e.g. mesh routing for OIDC). Match
# do_container_extra_arguments_custom in the host's vars.yml. Empty = none.
odoo_ghostrak_install_add_hosts: []

# Container UID:GID — should match what mash/do uses. The do role default
# resolves to sgc_playbook_uid:sgc_playbook_gid (999:988 on prime).
odoo_ghostrak_install_user: "{{ (sgc_playbook_uid | default(999)) ~ ':' ~ (sgc_playbook_gid | default(988)) }}"
