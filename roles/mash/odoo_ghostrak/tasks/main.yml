---
# odoo_ghostrak — Odoo-side provisioning for the two-tier ghostrak↔Odoo↔
# Authentik architecture. Each concern is its own task block, gated by a
# `_provision_<thing>` flag in defaults so concerns can be enabled/disabled
# independently. Scripts are piped through `docker exec ... psql` against the
# Odoo Postgres container. `changed_when` reads the psql "UPDATE N" line so
# re-runs that match desired state report changed=false.

- name: odoo_ghostrak — validate inputs
  ansible.builtin.assert:
    that:
      - odoo_ghostrak_postgres_container | length > 0
      - odoo_ghostrak_database_user | length > 0
      - odoo_ghostrak_database_name | length > 0
    fail_msg: "odoo_ghostrak requires postgres_container, database_user, and database_name to be set"
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when: odoo_ghostrak_enabled | bool

# --- OIDC groups-scope on auth_oauth_provider ------------------------------

- name: odoo_ghostrak — copy oidc-groups-scope SQL to host
  ansible.builtin.copy:
    src: oidc-groups-scope.sql
    dest: /tmp/odoo_ghostrak_oidc_groups_scope.sql
    mode: '0644'
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_groups_scope | bool

- name: odoo_ghostrak — ensure each required OIDC scope is present on auth_oauth_provider
  # One psql invocation per scope. The SQL takes :scope as a psql variable
  # and appends it idempotently (word-boundary regex skips already-present).
  # `changed_when` checks each iteration's output for "UPDATE 1".
  ansible.builtin.shell: >-
    docker exec -i
    {{ odoo_ghostrak_postgres_container }}
    psql -v ON_ERROR_STOP=1
    -v client_id={{ odoo_ghostrak_oidc_client_id | quote }}
    -v scope={{ item | quote }}
    -U {{ odoo_ghostrak_database_user | quote }}
    -d {{ odoo_ghostrak_database_name | quote }}
    < /tmp/odoo_ghostrak_oidc_groups_scope.sql
  loop: "{{ odoo_ghostrak_oidc_required_scopes }}"
  loop_control:
    label: "{{ item }}"
  register: odoo_ghostrak_groups_scope
  # psql's affected-row report is on the LAST line as "UPDATE N". N=0 is the
  # idempotent no-op; N≥1 means the row was actually changed.
  changed_when: "'UPDATE 0' not in odoo_ghostrak_groups_scope.stdout and (odoo_ghostrak_groups_scope.stdout is search('UPDATE '))"
  failed_when:
    - odoo_ghostrak_groups_scope.rc != 0
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_groups_scope | bool

- name: odoo_ghostrak — report OIDC scope results (one line per scope)
  ansible.builtin.debug:
    msg: "scope={{ item.item }} → {{ (item.stdout_lines | last) | default('(no output)') }}"
  loop: "{{ odoo_ghostrak_groups_scope.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('?') }}"
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_groups_scope | bool
    - odoo_ghostrak_groups_scope is defined
    - odoo_ghostrak_groups_scope.results is defined

- name: odoo_ghostrak — clean up oidc-groups-scope SQL from host
  ansible.builtin.file:
    path: /tmp/odoo_ghostrak_oidc_groups_scope.sql
    state: absent
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_groups_scope | bool

# --- Runtime settings delivered to Odoo via ir.config_parameter ------------

- name: odoo_ghostrak — copy set-config-parameter SQL to host
  ansible.builtin.copy:
    src: set-config-parameter.sql
    dest: /tmp/odoo_ghostrak_set_config_parameter.sql
    mode: '0644'
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_runtime_settings | bool

- name: odoo_ghostrak — upsert each runtime setting into ir_config_parameter
  # One psql invocation per key. The SQL only updates when the value is
  # genuinely different; psql's `INSERT 0 0` line gates changed_when.
  ansible.builtin.shell: >-
    docker exec -i
    {{ odoo_ghostrak_postgres_container }}
    psql -v ON_ERROR_STOP=1
    -v param_key={{ item.key | quote }}
    -v param_value={{ item.value | quote }}
    -U {{ odoo_ghostrak_database_user | quote }}
    -d {{ odoo_ghostrak_database_name | quote }}
    < /tmp/odoo_ghostrak_set_config_parameter.sql
  loop: "{{ odoo_ghostrak_runtime_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: odoo_ghostrak_runtime_settings_result
  # Omit the value from logs — token + webhook_secret would otherwise echo.
  no_log: true
  changed_when: "odoo_ghostrak_runtime_settings_result.stdout is search('INSERT 0 1')"
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_runtime_settings | bool

- name: odoo_ghostrak — clean up set-config-parameter SQL from host
  ansible.builtin.file:
    path: /tmp/odoo_ghostrak_set_config_parameter.sql
    state: absent
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_runtime_settings | bool

# --- Provision the bff-service Odoo user -----------------------------------
#
# Done BEFORE the addon install so a fresh deploy gets the user before any
# BFF traffic could arrive. The shell-based provisioner reads/writes through
# a regular ORM session so it coexists with the running long-running Odoo —
# no DB lock, no downtime.

- name: odoo_ghostrak — assert bff-service password resolved
  ansible.builtin.assert:
    that:
      - odoo_ghostrak_bff_service_user_password | length > 32
    fail_msg: >
      odoo_ghostrak_bff_service_user_password didn't resolve. Check that
      sgc_pgsk is set on this host (vault-encrypted in host_vars/<host>/
      vault.yml as vault_sgc_pgsk).
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_bff_service_user | bool

- name: odoo_ghostrak — provision bff-service Odoo user (via one-shot odoo shell)
  ansible.builtin.shell:
    cmd: >-
      docker run --rm -i
      --user={{ odoo_ghostrak_install_user }}
      --cap-drop=ALL
      --network={{ odoo_ghostrak_install_network }}
      -e BFF_SERVICE_PASSWORD={{ odoo_ghostrak_bff_service_user_password | quote }}
      --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/odoo.conf,dst=/etc/odoo/odoo.conf,readonly
      --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/data,dst=/var/lib/odoo
      --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/extra-addons,dst=/mnt/extra-addons,readonly
      {% for h in odoo_ghostrak_install_add_hosts %}--add-host={{ h }} {% endfor %}
      {{ odoo_ghostrak_install_do_image }}
      odoo-bin shell -c /etc/odoo/odoo.conf --no-http -d {{ odoo_ghostrak_database_name }}
    stdin: "{{ lookup('file', 'provision-bff-service-user.py') }}"
  register: odoo_ghostrak_bff_user
  # cmd echoes the password (via -e BFF_SERVICE_PASSWORD=…). Suppress.
  no_log: true
  changed_when: "odoo_ghostrak_bff_user.stdout is search('changed=True')"
  failed_when:
    - odoo_ghostrak_bff_user.rc != 0
    - odoo_ghostrak_bff_user.stdout is not search('OK ')
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_bff_service_user | bool

- name: odoo_ghostrak — report bff-service user result (status only, no secret)
  # Print only the stdout (the python script's "OK login=... changed=..." line);
  # the encompassing task's cmd has the password env-var inlined, so don't
  # debug the entire registered result.
  ansible.builtin.debug:
    msg: "{{ odoo_ghostrak_bff_user.stdout | default('(skipped)') }}"
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_bff_service_user | bool
    - odoo_ghostrak_bff_user is defined

# --- auth_oauth_provider hostname (SSO cookie unification) -----------------

- name: odoo_ghostrak — copy oidc-provider-hostname SQL to host
  ansible.builtin.copy:
    src: oidc-provider-hostname.sql
    dest: /tmp/odoo_ghostrak_oidc_provider_hostname.sql
    mode: '0644'
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_provider_hostname | bool

- name: odoo_ghostrak — re-point Odoo's Authentik OIDC provider at the unified SSO hostname
  ansible.builtin.shell: >-
    docker exec -i
    {{ odoo_ghostrak_postgres_container }}
    psql -v ON_ERROR_STOP=1
    -v client_id={{ odoo_ghostrak_oidc_client_id | quote }}
    -v hostname={{ odoo_ghostrak_oidc_provider_hostname | quote }}
    -U {{ odoo_ghostrak_database_user | quote }}
    -d {{ odoo_ghostrak_database_name | quote }}
    < /tmp/odoo_ghostrak_oidc_provider_hostname.sql
  register: odoo_ghostrak_oidc_hostname
  changed_when: "'UPDATE 0' not in odoo_ghostrak_oidc_hostname.stdout and (odoo_ghostrak_oidc_hostname.stdout is search('UPDATE '))"
  failed_when:
    - odoo_ghostrak_oidc_hostname.rc != 0
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_provider_hostname | bool

- name: odoo_ghostrak — report OIDC provider hostname result
  ansible.builtin.debug:
    msg: "provider hostname={{ odoo_ghostrak_oidc_provider_hostname }} → {{ (odoo_ghostrak_oidc_hostname.stdout_lines | last) | default('(skipped)') }}"
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_provider_hostname | bool
    - odoo_ghostrak_oidc_hostname is defined

- name: odoo_ghostrak — clean up oidc-provider-hostname SQL from host
  ansible.builtin.file:
    path: /tmp/odoo_ghostrak_oidc_provider_hostname.sql
    state: absent
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_provision_oidc_provider_hostname | bool

# --- One-shot BFF→Odoo data migration (seam #7 phase 4a) -------------------
#
# Run only when explicitly enabled in host_vars. Marker in
# ir.config_parameter gates re-runs. Same docker-run pattern as the
# bff-service provisioner (one-shot odoo shell on the same image/mounts/
# network; no downtime).

- name: odoo_ghostrak — run pre-seam-#7 BFF→Odoo data migration (one-shot)
  ansible.builtin.shell:
    cmd: >-
      docker run --rm -i
      --user={{ odoo_ghostrak_install_user }}
      --cap-drop=ALL
      --network={{ odoo_ghostrak_install_network }}
      --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/odoo.conf,dst=/etc/odoo/odoo.conf,readonly
      --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/data,dst=/var/lib/odoo
      --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/extra-addons,dst=/mnt/extra-addons,readonly
      {% for h in odoo_ghostrak_install_add_hosts %}--add-host={{ h }} {% endfor %}
      {{ odoo_ghostrak_install_do_image }}
      odoo-bin shell -c /etc/odoo/odoo.conf --no-http -d {{ odoo_ghostrak_database_name }}
    stdin: "{{ lookup('file', 'migrate-bff-to-odoo-v1.py') }}"
  register: odoo_ghostrak_migration_v1
  changed_when: "odoo_ghostrak_migration_v1.stdout is search('changed=True')"
  failed_when:
    - odoo_ghostrak_migration_v1.rc != 0
    - odoo_ghostrak_migration_v1.stdout is not search('OK ')
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_run_migration_bff_to_odoo_v1 | bool

- name: odoo_ghostrak — report migration result
  ansible.builtin.debug:
    msg: "{{ odoo_ghostrak_migration_v1.stdout | default('(skipped — migration flag off)') }}"
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_run_migration_bff_to_odoo_v1 | bool
    - odoo_ghostrak_migration_v1 is defined

# --- Install the `ghostrak` custom Odoo addon ------------------------------

- name: odoo_ghostrak — verify addon source exists on controller
  ansible.builtin.stat:
    path: "{{ odoo_ghostrak_addon_src_path }}/__manifest__.py"
  delegate_to: localhost
  become: false
  register: odoo_ghostrak_addon_src_stat
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

- name: odoo_ghostrak — assert addon source is present
  ansible.builtin.assert:
    that:
      - odoo_ghostrak_addon_src_stat.stat.exists
    fail_msg: >
      odoo_ghostrak_addon_src_path '{{ odoo_ghostrak_addon_src_path }}' has no
      __manifest__.py on the controller — point this at the directory of the
      ghostrak Odoo addon (default: ~/apps/ghostrak/odoo-addon/ghostrak).
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

- name: odoo_ghostrak — ensure addon target dir exists on host
  ansible.builtin.file:
    path: "{{ odoo_ghostrak_addon_dst_path }}"
    state: directory
    owner: "{{ do_user | default(sgc_playbook_user) | default('root') }}"
    group: "{{ do_group | default(sgc_playbook_group_name) | default('root') }}"
    mode: '0755'
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

# Idempotency gate. ansible.posix.synchronize always reports changed=true
# because it stat-updates the destination (perms/timestamps) even when file
# content matches — that triggered ~30s of Odoo downtime on every role run.
# We hash the source tree on the controller, compare against the marker on
# the host, and only sync+install when the hashes differ. Marker is written
# AFTER the install succeeds, so an interrupted run re-installs next time.
- name: odoo_ghostrak — compute addon source hash (controller)
  ansible.builtin.shell:
    cmd: >-
      find {{ odoo_ghostrak_addon_src_path | quote }} -type f
      -not -path '*__pycache__*' -not -name '*.pyc' -not -path '*/.git/*'
      -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
  register: odoo_ghostrak_addon_src_hash
  delegate_to: localhost
  become: false
  changed_when: false
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

- name: odoo_ghostrak — read previous hash marker on host
  ansible.builtin.slurp:
    src: "{{ odoo_ghostrak_addon_dst_path }}/.odoo_ghostrak_addon_hash"
  register: odoo_ghostrak_addon_dst_hash_raw
  failed_when: false
  changed_when: false
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

- name: odoo_ghostrak — decide whether addon source has changed
  ansible.builtin.set_fact:
    odoo_ghostrak_addon_changed: >-
      {{ (odoo_ghostrak_addon_dst_hash_raw.content | default('') | b64decode | trim)
         != (odoo_ghostrak_addon_src_hash.stdout | trim) }}
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

- name: odoo_ghostrak — rsync addon source to host (only when content changed)
  ansible.posix.synchronize:
    src: "{{ odoo_ghostrak_addon_src_path }}/"
    dest: "{{ odoo_ghostrak_addon_dst_path }}/"
    delete: true
    recursive: true
    checksum: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.git"
      - "--exclude=.odoo_ghostrak_addon_hash"
  register: odoo_ghostrak_addon_sync
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool
    - odoo_ghostrak_addon_changed | bool
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool

# Module install/upgrade only when sync actually moved files. On a no-op
# sync the running Odoo stays up untouched. The first run on a fresh host
# always changes (addon dst is empty) so the install fires.
- name: odoo_ghostrak — install/upgrade the ghostrak module (brief downtime)
  block:
    - name: Stop Odoo to release DB locks
      ansible.builtin.systemd:
        name: "{{ odoo_ghostrak_systemd_service }}"
        state: stopped

    - name: Install/upgrade ghostrak module via one-shot docker run
      # Mirrors the systemd unit's `docker create` invocation (image, user,
      # cap-drop, volumes, add-host) but joins only the postgres network
      # (--no-http means we don't need traefik/main network connectivity).
      # docker run accepts --add-host repeated, so a Jinja loop emits each.
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --user={{ odoo_ghostrak_install_user }}
          --cap-drop=ALL
          --network={{ odoo_ghostrak_install_network }}
          --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/odoo.conf,dst=/etc/odoo/odoo.conf,readonly
          --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/data,dst=/var/lib/odoo
          --mount type=bind,src={{ odoo_ghostrak_install_do_base_path }}/extra-addons,dst=/mnt/extra-addons,readonly
          {% for h in odoo_ghostrak_install_add_hosts %}--add-host={{ h }} {% endfor %}
          {{ odoo_ghostrak_install_do_image }}
          odoo --no-http
          -d {{ odoo_ghostrak_database_name }}
          -u {{ odoo_ghostrak_addon_module_name }}
          -i {{ odoo_ghostrak_addon_module_name }}
          --stop-after-init --without-demo=all
      register: odoo_ghostrak_module_install
      changed_when: true
      failed_when:
        - odoo_ghostrak_module_install.rc != 0

    - name: Start Odoo back up
      ansible.builtin.systemd:
        name: "{{ odoo_ghostrak_systemd_service }}"
        state: started
  rescue:
    # If install fails, make damn sure the service comes back up before we
    # propagate the error — leaving prime-do stopped is the bad outcome.
    - name: (rescue) Start Odoo back up after install failure
      ansible.builtin.systemd:
        name: "{{ odoo_ghostrak_systemd_service }}"
        state: started
    - name: (rescue) Re-raise the install failure
      ansible.builtin.fail:
        msg: "ghostrak module install failed; Odoo restarted. See task output above."
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool
    - odoo_ghostrak_addon_changed | default(false) | bool

# Write the hash marker only AFTER a successful install — an interrupted run
# leaves the marker stale (matching nothing), forcing the next run to redo
# install. This is the safe failure mode (slower retry vs. silent skip of
# a broken state).
- name: odoo_ghostrak — write addon hash marker on host
  ansible.builtin.copy:
    content: "{{ odoo_ghostrak_addon_src_hash.stdout | trim }}\n"
    dest: "{{ odoo_ghostrak_addon_dst_path }}/.odoo_ghostrak_addon_hash"
    owner: "{{ do_user | default(sgc_playbook_user) | default('root') }}"
    group: "{{ do_group | default(sgc_playbook_group_name) | default('root') }}"
    mode: '0644'
  tags:
    - setup-all
    - setup-odoo_ghostrak
    - install-all
    - install-odoo_ghostrak
  when:
    - odoo_ghostrak_enabled | bool
    - odoo_ghostrak_install_addon | bool
    - odoo_ghostrak_addon_changed | default(false) | bool
