---
# Mirrors the SGC service-role convention (see roles/galaxy/peertube):
# all work lives in a single tagged block so `just install-service
# pds_signup` / `just setup-service pds_signup` (which filter on
# install-pds_signup / setup-pds_signup) actually reach the tasks.
- name: Perform pds-signup installation tasks
  when: pds_signup_enabled | bool
  tags:
    - setup-all
    - setup-pds_signup
    - install-all
    - install-pds_signup
  block:
    - name: Install pds-signup
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"
