---
- name: Validate configuration
  ansible.builtin.assert:
    that:
      - pds_signup_enabled | bool
      - pds_signup_hostname | length > 0
      - pds_signup_database_hostname | length > 0
    fail_msg: >-
      pds_signup_enabled, pds_signup_hostname, and pds_signup_database_hostname
      are required. Set them per-host in inventory/host_vars/<host>/vars.yml.

- name: Create pds-signup base directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pds_signup_base_path }}",    mode: "0755" }
    - { path: "{{ pds_signup_etc_path }}",     mode: "0750" }
    - { path: "{{ pds_signup_secrets_path }}", mode: "0700" }
    - { path: "{{ pds_signup_state_path }}",   mode: "0750" }

- name: Write session secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_state_path }}/session-secret"
    content: "{{ pds_signup_session_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  no_log: true
  notify: restart pds-signup

- name: Write database URL
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/database-url"
    content: "{{ pds_signup_database_url }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  no_log: true
  notify: restart pds-signup

- name: Write provisioning HMAC secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/provisioning-hmac-secret"
    content: "{{ pds_signup_provisioning_hmac_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  no_log: true
  notify: restart pds-signup

# OAuth client secrets — each only written when the provider is enabled.
- name: Write Google OAuth client secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/google-client-secret"
    content: "{{ pds_signup_oauth_google_client_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_oauth_google_enabled | bool
  no_log: true
  notify: restart pds-signup

- name: Write Apple OAuth private key
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/apple-private-key"
    content: "{{ pds_signup_oauth_apple_private_key }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_oauth_apple_enabled | bool
  no_log: true
  notify: restart pds-signup

- name: Write Microsoft OAuth client secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/microsoft-client-secret"
    content: "{{ pds_signup_oauth_microsoft_client_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_oauth_microsoft_enabled | bool
  no_log: true
  notify: restart pds-signup

- name: Write Meta OAuth client secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/meta-client-secret"
    content: "{{ pds_signup_oauth_meta_client_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_oauth_meta_enabled | bool
  no_log: true
  notify: restart pds-signup

- name: Write X OAuth client secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/x-client-secret"
    content: "{{ pds_signup_oauth_x_client_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_oauth_x_enabled | bool
  no_log: true
  notify: restart pds-signup

- name: Write TikTok OAuth client secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/tiktok-client-secret"
    content: "{{ pds_signup_oauth_tiktok_client_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_oauth_tiktok_enabled | bool
  no_log: true
  notify: restart pds-signup

# Billing provider secrets — only the active provider's secrets are written.
- name: Write Stripe secret key
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/stripe-secret-key"
    content: "{{ pds_signup_billing_stripe_secret_key }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_billing_provider == 'stripe' and pds_signup_billing_stripe_secret_key | length > 0
  no_log: true
  notify: restart pds-signup

- name: Write Stripe webhook secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/stripe-webhook-secret"
    content: "{{ pds_signup_billing_stripe_webhook_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_billing_provider == 'stripe' and pds_signup_billing_stripe_webhook_secret | length > 0
  no_log: true
  notify: restart pds-signup

- name: Write Paddle API key
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/paddle-api-key"
    content: "{{ pds_signup_billing_paddle_api_key }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_billing_provider == 'paddle' and pds_signup_billing_paddle_api_key | length > 0
  no_log: true
  notify: restart pds-signup

- name: Write Paddle webhook secret
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/paddle-webhook-secret"
    content: "{{ pds_signup_billing_paddle_webhook_secret }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_billing_provider == 'paddle' and pds_signup_billing_paddle_webhook_secret | length > 0
  no_log: true
  notify: restart pds-signup

- name: Write Cloudflare API token
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/cloudflare-api-token"
    content: "{{ pds_signup_cloudflare_api_token }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  when: pds_signup_cloudflare_api_token | length > 0
  no_log: true
  notify: restart pds-signup

- name: Write Porkbun affiliate API keys
  ansible.builtin.copy:
    dest: "{{ pds_signup_secrets_path }}/{{ item.name }}"
    content: "{{ item.value }}"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0600"
  loop:
    - { name: "porkbun-api-key",       value: "{{ pds_signup_affiliate_porkbun_api_key }}" }
    - { name: "porkbun-secret-api-key", value: "{{ pds_signup_affiliate_porkbun_secret_api_key }}" }
  loop_control:
    label: "{{ item.name }}"
  when: pds_signup_affiliate_porkbun_enabled | bool
  no_log: true
  notify: restart pds-signup

- name: Render pds-signup config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ pds_signup_etc_path }}/config.yaml"
    owner: "{{ pds_signup_uid }}"
    group: "{{ pds_signup_gid }}"
    mode: "0640"
  notify: restart pds-signup

- name: Install pds-signup systemd service
  ansible.builtin.template:
    src: pds-signup.service.j2
    dest: "/etc/systemd/system/{{ pds_signup_identifier }}.service"
    mode: "0644"
  notify: restart pds-signup

- name: Pull pds-signup container image
  community.docker.docker_image:
    name: "{{ pds_signup_container_image }}"
    source: pull
    force_source: true
  when: not (pds_signup_container_image_self_build | bool)

- name: Ensure pds-signup container network exists
  community.docker.docker_network:
    name: "{{ pds_signup_container_network }}"
    driver: bridge
    state: present

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start pds-signup service
  ansible.builtin.service:
    name: "{{ pds_signup_identifier }}"
    state: started
    enabled: true
