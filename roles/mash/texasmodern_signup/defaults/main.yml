---
# SGC role: texasmodern_signup
#
# Manages ONLY the .env (secrets) for the texasmodern-signup.eagledrive.live
# AWS EC2 stack at /opt/tmw/infra/aws/.env, then (re)starts the compose
# stack so a rotated secret takes effect.
#
# Scope is deliberately .env-only. The docker-compose.yml, Caddyfile, and
# all application source (api/web/caddy) are owned by the TMW app's own
# deploy tool: ~/b2b/TexasModernWaste/bin/deploy.sh, which tars
# `api web infra` over /opt/tmw on each deploy. That tar EXCLUDES .env,
# so the two systems coexist: deploy.sh ships code + compose + Caddyfile,
# this role ships the .env deploy.sh can't see. Earlier this role also
# rendered docker-compose.yml, which FOUGHT deploy.sh (every deploy
# reverted the role's compose, taking the admin login + tmw.eagledrive.live
# down on 2026-05-20). Compose ownership now lives solely in the canonical
# source. See [[project-tmw-authentik-outpost]] for the full history.
#
# The mesh extra_hosts pin, the proxy image pin (2025.10.3), and the
# tmw.eagledrive.live Caddy redirect now live in
# ~/b2b/TexasModernWaste/infra/aws/{docker-compose.yml,Caddyfile}.

texasmodern_signup_enabled: false

# Filesystem layout (mirrors what's already on the EC2; do not change
# without coordinating with the team that places the source tree).
texasmodern_signup_base_path: /opt/tmw
texasmodern_signup_compose_path: "{{ texasmodern_signup_base_path }}/infra/aws"

# Public-facing hostname (Caddy serves TLS for this; Cloudflare-proxied
# orange-cloud, DNS-01 via the cloudflare token below).
texasmodern_signup_hostname: "texasmodern-signup.eagledrive.live"

# Caddy ACME contact.
texasmodern_signup_caddy_email: ""

# Cloudflare API token (Zone:DNS:Edit + Zone:Zone:Read on
# eagledrive.live) — used by caddy-dns/cloudflare for DNS-01.
# REQUIRED. Provide via vault.
texasmodern_signup_cloudflare_api_token: ""

# CORS: the Fastify API only accepts requests from the public origin.
texasmodern_signup_cors_origins: "https://{{ texasmodern_signup_hostname }}"

# Expo bundle is served at the site root, so the web app talks to /api
# (relative) — leaving this empty mirrors the live deploy.
texasmodern_signup_expo_public_api_url: ""

# Postgres (compose-managed, single-host).
texasmodern_signup_postgres_user: "tmw"
texasmodern_signup_postgres_db: "tmw"
# REQUIRED. Provide via vault. Cannot be silently rotated — the
# database is initialized with this value and pg_authid holds it;
# changing it without an ALTER USER will break the api container.
texasmodern_signup_postgres_password: ""

# ntfy push notifications. Empty NTFY_BASE_URL makes the API's
# publish() a no-op, so the form stays functional even before ntfy is
# reachable.
texasmodern_signup_ntfy_base_url: "https://ntfy.eagledrive.live"
# REQUIRED when NTFY_BASE_URL is set. Provide via vault.
texasmodern_signup_ntfy_auth_token: ""
texasmodern_signup_ntfy_topic_signup: "tmw-signup"
texasmodern_signup_ntfy_topic_view: "tmw-view"

# Authentik proxy Outpost — the bits that live in .env.
# Server-side provisioning lives on bskypds.pro (see texasmodern_authentik_*
# vars + provision-texasmodern.py). The token below is the Outpost API
# token printed by that script — paste it into vault after a fresh
# provisioning run.
#
# NOTE: the mesh extra_hosts pin and the proxy image pin are NOT here —
# they're compose concerns owned by the canonical source
# (~/b2b/TexasModernWaste/infra/aws/docker-compose.yml). Only the two
# values that flow through .env live in this role.
texasmodern_signup_authentik_host: "https://auth.eagledrive.live"
# REQUIRED. Provide via vault.
texasmodern_signup_authentik_outpost_token: ""

# --- Odoo (do.sgc.ai): signups → crm.lead, customers → res.partner + sale.order.
# The texasmodern-service user + products are provisioned on the odoo host by the
# odoo_texasmodern role; this only renders the app's connection env. All four of
# URL/DB/USER/API_KEY must be non-empty for the app's isOdooConfigured() to enable
# the integration. api_key derives from the odoo host's sgc_pgsk (cross-host
# hostvars, no hand-off) — same pattern + suffix as odoo_texasmodern sets Odoo-side.
texasmodern_signup_odoo_url: "https://do.sgc.ai"
texasmodern_signup_odoo_db: "{{ hostvars['odoo'].do_database_name | default('sgc-do') }}"
texasmodern_signup_odoo_user: "texasmodern-service"
texasmodern_signup_odoo_api_key: "{{ ((hostvars['odoo'].sgc_pgsk | default('')) ~ '.odoo.texasmodern') | hash('sha256') }}"
texasmodern_signup_odoo_company_name: "Texas Modern Waste"
