---
# Scope: this role owns ONLY /opt/tmw/infra/aws/.env (secrets).
# docker-compose.yml and Caddyfile are owned by the TMW app's own
# deploy tool (~/b2b/TexasModernWaste/bin/deploy.sh, which tars
# `api web infra` over /opt/tmw). That tool EXCLUDES .env, so the two
# systems don't fight: deploy.sh ships code + compose + Caddyfile, this
# role ships the .env it can't see. See [[project-tmw-authentik-outpost]].

- name: Ensure compose directory exists
  ansible.builtin.file:
    path: "{{ texasmodern_signup_compose_path }}"
    state: directory
    mode: "0755"

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ texasmodern_signup_compose_path }}/.env"
    mode: "0600"
    backup: true
  register: texasmodern_signup_env_rendered

# Apply .env changes to the running stack. The compose file itself is
# provided by deploy.sh (not this role); we just (re)create containers
# so a rotated secret takes effect. No-op when .env is unchanged.
# `build: never` — images are built by deploy.sh, never here.
- name: (Re)start the texasmodern_signup stack to apply .env
  community.docker.docker_compose_v2:
    project_src: "{{ texasmodern_signup_compose_path }}"
    state: present
    build: never
    pull: missing
  when: texasmodern_signup_env_rendered.changed
