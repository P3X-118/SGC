---
# odoo_sgc_companies — ensure the SGC operator company + the independent managed
# companies + per-user multi-company access on the do.sgc.ai Odoo via ONE one-shot
# `odoo-bin shell` docker run (own DB session, no downtime). Idempotent: the
# script reports changed=True only when it mutated something; "OK " gates failed_when.

- name: odoo_sgc_companies — validate inputs
  ansible.builtin.assert:
    that:
      - odoo_sgc_companies_database_name | length > 0
      - odoo_sgc_companies_operator | length > 0
    fail_msg: "odoo_sgc_companies requires database_name and operator"
  tags:
    - setup-all
    - setup-odoo_sgc_companies
    - install-all
    - install-odoo_sgc_companies
  when: odoo_sgc_companies_enabled | bool

- name: odoo_sgc_companies — ensure SGC operator + managed companies + multi-company access (one-shot odoo shell)
  ansible.builtin.shell:
    cmd: >-
      docker run --rm -i
      --user={{ odoo_sgc_companies_install_user }}
      --cap-drop=ALL
      --network={{ odoo_sgc_companies_install_network }}
      -e SGC_OPERATOR={{ odoo_sgc_companies_operator | quote }}
      -e SGC_MANAGED={{ (odoo_sgc_companies_managed | join(',')) | quote }}
      --mount type=bind,src={{ odoo_sgc_companies_install_do_base_path }}/odoo.conf,dst=/etc/odoo/odoo.conf,readonly
      --mount type=bind,src={{ odoo_sgc_companies_install_do_base_path }}/data,dst=/var/lib/odoo
      --mount type=bind,src={{ odoo_sgc_companies_install_do_base_path }}/extra-addons,dst=/mnt/extra-addons,readonly
      {% for h in odoo_sgc_companies_install_add_hosts %}--add-host={{ h }} {% endfor %}
      {{ odoo_sgc_companies_install_do_image }}
      odoo-bin shell -c /etc/odoo/odoo.conf --no-http -d {{ odoo_sgc_companies_database_name }}
    stdin: "{{ lookup('file', 'provision-sgc-companies.py') }}"
  register: odoo_sgc_companies_run
  changed_when: "odoo_sgc_companies_run.stdout is search('changed=True')"
  failed_when:
    - odoo_sgc_companies_run.rc != 0
    - odoo_sgc_companies_run.stdout is not search('OK ')
  tags:
    - setup-all
    - setup-odoo_sgc_companies
    - install-all
    - install-odoo_sgc_companies
  when: odoo_sgc_companies_enabled | bool

- name: odoo_sgc_companies — report
  ansible.builtin.debug:
    msg: "{{ odoo_sgc_companies_run.stdout | default('(skipped)') }}"
  tags:
    - setup-all
    - setup-odoo_sgc_companies
    - install-all
    - install-odoo_sgc_companies
  when:
    - odoo_sgc_companies_enabled | bool
    - odoo_sgc_companies_run is defined
