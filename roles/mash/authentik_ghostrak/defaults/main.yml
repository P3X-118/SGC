---
# authentik_ghostrak — provisions all ghostrak-specific state inside the
# bskypds.pro Authentik (groups, scopes, service accounts, tokens). Runs ONLY
# on the host that hosts Authentik; idempotent so re-runs are no-ops once the
# state matches. Mirrors the existing ad-hoc `~/sgc/apps/authentik/scripts/sgc/
# provision-ghostrak-*.py` pattern but folded into a role so deploys are
# repeatable and don't require `docker exec ... ak shell < script.py` by hand.
#
# Enable on host_vars/bskypds.pro/vars.yml:
#   authentik_ghostrak_enabled: true
# Then: `just install-service authentik_ghostrak --limit bskypds.pro`
#
# Each provisioning concern (capability groups, tokens, OIDC providers, etc.)
# is gated by its own _provision_* flag so individual concerns can be skipped
# or run independently. As more provisioning logic moves into this role,
# add another `_provision_<thing>` flag + a corresponding task block.

authentik_ghostrak_enabled: false

# Name of the running authentik-server container on this host. Same one used
# by the existing ad-hoc provisioning scripts.
authentik_ghostrak_container_name: pds-authentik-server

# ---------------------------------------------------------------------------
# Capability groups
#
# Coarse role groups that flow into the JWT `groups` claim and gate ghostrak
# BFF authz at the cheapest possible layer (claim check, no I/O). The fine
# per-facility/per-player assignments are owned by Odoo (the `ghostrak` Odoo
# addon), which syncs membership in these groups via the Authentik admin
# token whenever an assignment changes.
# ---------------------------------------------------------------------------
authentik_ghostrak_provision_capability_groups: true

authentik_ghostrak_capability_groups:
  - ghostrak-admins             # cross-cutting admin (system-level)
  - ghostrak-facility-owners    # may own one or more facilities
  - ghostrak-coaches            # coach somewhere (fine scope in Odoo)
  - ghostrak-recruiters         # recruiter somewhere (fine scope in Odoo)
  - ghostrak-users              # self-serve users / players with logins


# ---------------------------------------------------------------------------
# OIDC `groups` claim mapping
#
# Creates a single ScopeMapping (`ghostrak: groups scope`) that emits the
# user's Authentik group names as a `groups` JWT claim, then attaches it to
# the named OAuth2 providers. Once attached, a client that requests
# `openid profile email groups` will see `"groups": ["ghostrak-coaches", ...]`
# in its token — this is the bridge that makes two-tier authz cheap (cap-group
# check in JWT, no admin-API call on the hot path).
#
# The default expression mirrors Authentik's own group-emit pattern
# (request.user.ak_groups). To use a different claim name (e.g., `roles`),
# override authentik_ghostrak_groups_scope_name.
# ---------------------------------------------------------------------------
authentik_ghostrak_provision_oidc_groups_scope: true

# OIDC scope name = JWT claim key. Clients request this scope explicitly
# (e.g. Odoo's auth_oauth provider record's `scope` column needs to include
# this string for the mapping to engage).
authentik_ghostrak_groups_scope_name: groups

# OAuth2 providers (by `name` first, then `client_id`) to attach the mapping
# to. Missing providers are SKIPPED, not errored — re-run after creating them.
authentik_ghostrak_oidc_providers:
  - ghostrak    # the ghostrak BFF's OIDC client (provisioned by provision-ghostrak.py)
  - prime       # Prime Baseball Odoo's OIDC client (provisioned by provision-prime.py)


# ---------------------------------------------------------------------------
# Odoo write-token
#
# Provisions svc-ghostrak-odoo (a service account with permission to add/
# remove users from groups, but NOT to create/modify users) and a token the
# ghostrak Odoo addon uses to call Authentik admin API on res.partner role
# changes. Closes seam #3.
#
# The token VALUE is derived from the consumer host's sgc_pgsk so both sides
# (Authentik provisioning here, Odoo addon delivery in mash/odoo_ghostrak's
# matching concern) compute the same string without operator hand-off.
# Cross-host: when this role runs (limited to bskypds.pro), inventory still
# parses host_vars for every host, so hostvars[<consumer>]['sgc_pgsk']
# resolves.
# ---------------------------------------------------------------------------
authentik_ghostrak_provision_odoo_write_token: true

# Host whose sgc_pgsk drives the token derivation. The consumer's
# mash/odoo_ghostrak role on this host writes the same value to Odoo's
# ir.config_parameter.
authentik_ghostrak_odoo_consumer_host: "prime.i.legit.services"

# Same string is hashed on both sides:
authentik_ghostrak_odoo_write_token: "{{ ((hostvars[authentik_ghostrak_odoo_consumer_host]['sgc_pgsk'] | default('')) ~ '.authentik.odoo') | hash('sha256') }}"
