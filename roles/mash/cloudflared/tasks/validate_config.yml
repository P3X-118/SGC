---
- name: Fail if required Cloudflared settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - cloudflared_uid
    - cloudflared_gid
    - cloudflared_environment_variable_tunnel_token
