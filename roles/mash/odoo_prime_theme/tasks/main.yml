---
# odoo_prime_theme — same hash-marker idempotency pattern as
# mash/odoo_prime_login / mash/odoo_ghostrak's install_addon concern. The
# duplication across the prime_* addon roles is intentional — each role stays
# self-contained and named after the concern it owns (prime_theme is the
# asset-only Prime backend skin). If a shared mash/do_addon_install role is
# ever factored out, this is one of the wrappers to fold in.

- name: odoo_prime_theme — validate inputs
  ansible.builtin.assert:
    that:
      - odoo_prime_theme_src_path | length > 0
      - odoo_prime_theme_dst_path | length > 0
      - odoo_prime_theme_database_name | length > 0
      - odoo_prime_theme_systemd_service | length > 0
      - odoo_prime_theme_install_do_image | length > 0
      - odoo_prime_theme_install_network | length > 0
    fail_msg: "odoo_prime_theme requires module_name, src/dst paths, db name, systemd service, image, and network to be set"
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

- name: odoo_prime_theme — verify source exists on controller
  ansible.builtin.stat:
    path: "{{ odoo_prime_theme_src_path }}/__manifest__.py"
  delegate_to: localhost
  become: false
  register: odoo_prime_theme_src_stat
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

- name: odoo_prime_theme — assert source is present
  ansible.builtin.assert:
    that:
      - odoo_prime_theme_src_stat.stat.exists
    fail_msg: >
      odoo_prime_theme_src_path '{{ odoo_prime_theme_src_path }}' has no
      __manifest__.py on the controller. Default points at
      ~/b2b/primeBaseball/odoo-addons/prime_theme.
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

- name: odoo_prime_theme — ensure target dir exists on host
  ansible.builtin.file:
    path: "{{ odoo_prime_theme_dst_path }}"
    state: directory
    owner: "{{ do_user | default(sgc_playbook_user) | default('root') }}"
    group: "{{ do_group | default(sgc_playbook_group_name) | default('root') }}"
    mode: '0755'
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

# Hash-marker idempotency. Same pattern as odoo_prime_login — synchronize alone
# always reports changed=true, so we gate on a content hash.
- name: odoo_prime_theme — compute source hash (controller)
  ansible.builtin.shell:
    cmd: >-
      find {{ odoo_prime_theme_src_path | quote }} -type f
      -not -path '*__pycache__*' -not -name '*.pyc' -not -path '*/.git/*'
      -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
  register: odoo_prime_theme_src_hash
  delegate_to: localhost
  become: false
  changed_when: false
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

- name: odoo_prime_theme — read previous hash marker on host
  ansible.builtin.slurp:
    src: "{{ odoo_prime_theme_dst_path }}/.odoo_prime_theme_addon_hash"
  register: odoo_prime_theme_dst_hash_raw
  failed_when: false
  changed_when: false
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

- name: odoo_prime_theme — decide whether source has changed
  ansible.builtin.set_fact:
    odoo_prime_theme_addon_changed: >-
      {{ (odoo_prime_theme_dst_hash_raw.content | default('') | b64decode | trim)
         != (odoo_prime_theme_src_hash.stdout | trim) }}
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when: odoo_prime_theme_enabled | bool

- name: odoo_prime_theme — rsync source to host (only when content changed)
  ansible.posix.synchronize:
    src: "{{ odoo_prime_theme_src_path }}/"
    dest: "{{ odoo_prime_theme_dst_path }}/"
    delete: true
    recursive: true
    checksum: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.git"
      - "--exclude=.odoo_prime_theme_addon_hash"
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when:
    - odoo_prime_theme_enabled | bool
    - odoo_prime_theme_addon_changed | bool

- name: odoo_prime_theme — install/upgrade the prime_theme module (brief downtime)
  block:
    - name: Stop Odoo to release DB locks
      ansible.builtin.systemd:
        name: "{{ odoo_prime_theme_systemd_service }}"
        state: stopped

    - name: Install/upgrade prime_theme via one-shot docker run
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --user={{ odoo_prime_theme_install_user }}
          --cap-drop=ALL
          --network={{ odoo_prime_theme_install_network }}
          --mount type=bind,src={{ odoo_prime_theme_install_do_base_path }}/odoo.conf,dst=/etc/odoo/odoo.conf,readonly
          --mount type=bind,src={{ odoo_prime_theme_install_do_base_path }}/data,dst=/var/lib/odoo
          --mount type=bind,src={{ odoo_prime_theme_install_do_base_path }}/extra-addons,dst=/mnt/extra-addons,readonly
          {% for h in odoo_prime_theme_install_add_hosts %}--add-host={{ h }} {% endfor %}
          {{ odoo_prime_theme_install_do_image }}
          odoo --no-http
          -d {{ odoo_prime_theme_database_name }}
          -u {{ odoo_prime_theme_module_name }}
          -i {{ odoo_prime_theme_module_name }}
          --stop-after-init --without-demo=all
      register: odoo_prime_theme_module_install
      changed_when: true
      failed_when:
        - odoo_prime_theme_module_install.rc != 0

    - name: Start Odoo back up
      ansible.builtin.systemd:
        name: "{{ odoo_prime_theme_systemd_service }}"
        state: started
  rescue:
    - name: (rescue) Start Odoo back up after install failure
      ansible.builtin.systemd:
        name: "{{ odoo_prime_theme_systemd_service }}"
        state: started
    - name: (rescue) Re-raise the install failure
      ansible.builtin.fail:
        msg: "prime_theme module install failed; Odoo restarted. See task output above."
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when:
    - odoo_prime_theme_enabled | bool
    - odoo_prime_theme_addon_changed | default(false) | bool

- name: odoo_prime_theme — write addon hash marker on host
  ansible.builtin.copy:
    content: "{{ odoo_prime_theme_src_hash.stdout | trim }}\n"
    dest: "{{ odoo_prime_theme_dst_path }}/.odoo_prime_theme_addon_hash"
    owner: "{{ do_user | default(sgc_playbook_user) | default('root') }}"
    group: "{{ do_group | default(sgc_playbook_group_name) | default('root') }}"
    mode: '0644'
  tags:
    - setup-all
    - setup-odoo_prime_theme
    - install-all
    - install-odoo_prime_theme
  when:
    - odoo_prime_theme_enabled | bool
    - odoo_prime_theme_addon_changed | default(false) | bool
