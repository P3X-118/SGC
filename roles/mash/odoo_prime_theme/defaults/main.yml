---
# odoo_prime_theme — installs the prime_theme custom Odoo module on the
# prime.i.legit.services Odoo. The module is an ASSET-ONLY backend skin: a
# warm-grey dark UI with the red #dd1717 Prime brand accent (primebeaumont.com
# look), shipped because Odoo 19 Community has no working native dark mode. It
# contributes SCSS to web._assets_primary_variables (prepend) + web.assets_backend,
# so a one-shot `-u` regenerates the web asset bundles.
#
# Sourced from `~/b2b/primeBaseball/odoo-addons/prime_theme/` on the
# controller; rsynced into the host's do_extra_addons_path and installed via
# a one-shot `docker run` that mirrors the running prime-do systemd unit's
# image/mounts/network/add-host. Same idempotency pattern as
# mash/odoo_prime_login — a content-hash marker on the host gates whether the
# stop/install/start cycle fires.
#
# Enable per-host (on prime.i.legit.services):
#   odoo_prime_theme_enabled: true
# Then: `just install-service odoo_prime_theme --limit prime.i.legit.services`.

odoo_prime_theme_enabled: false

odoo_prime_theme_module_name: prime_theme

# Absolute path on the CONTROLLER — defaults to the prime engagement
# workspace (the canonical home for prime-only Odoo modules).
odoo_prime_theme_src_path: "/home/oneill/b2b/primeBaseball/odoo-addons/{{ odoo_prime_theme_module_name }}"

# Target on the HOST. Mirrors the do role's do_extra_addons_path layout.
odoo_prime_theme_dst_path: "{{ do_extra_addons_path | default('/' ~ (sgc_playbook_identifier | default('do')) ~ '/' ~ (do_identifier | default('do')) ~ '/extra-addons') }}/{{ odoo_prime_theme_module_name }}"

# DB the module installs into. Same default as odoo_prime_login.
odoo_prime_theme_database_name: "{{ do_identifier | default('do') }}"

# --- Install runtime (mirror prime-do systemd unit) ----------------------
# Defaults match mash/do's docker create args so the install container runs
# the same code as the long-running service.
odoo_prime_theme_systemd_service: "{{ (do_identifier | default('do')) ~ '.service' }}"
odoo_prime_theme_install_do_base_path: "{{ do_base_path | default('/' ~ (sgc_playbook_identifier | default('do')) ~ '/' ~ (do_identifier | default('do'))) }}"
odoo_prime_theme_install_do_image: "sgc-do:{{ do_image_version | default('19.0') }}-{{ do_image_release | default('01') }}"
odoo_prime_theme_install_network: "{{ (sgc_playbook_identifier | default('do')) ~ '-postgres' }}"
# Asset-only theme upgrade does NO OIDC, so no mesh add-hosts are required by
# default. The prime host_vars sets them anyway for parity with the sibling
# roles (harmless in the throwaway install container).
odoo_prime_theme_install_add_hosts: []
odoo_prime_theme_install_user: "{{ (sgc_playbook_uid | default(999)) ~ ':' ~ (sgc_playbook_gid | default(988)) }}"
