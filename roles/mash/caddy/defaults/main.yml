---
# caddi backend (voice-first golf caddy: sync/backup + LLM proxy)
#
# Project source code URL: https://github.com/P3X-118/caddi-backend  # TODO: repo does not exist yet
#
# NOTE ON SPELLING: the product/app is "caddi" (with an *i*); all deployment
# identifiers use "caddy" (with a *y*, matching the domain caddy.courses):
# role repo caddy-ar, var prefix caddy_, service identifier sgc-caddy.

caddy_enabled: true

caddy_identifier: caddy
caddy_base_path: "/{{ caddy_identifier }}"

caddy_uid: ""
caddy_gid: ""

# The scheme used for serving the caddi backend.
caddy_scheme: https

# The hostname at which the caddi backend is served (e.g. `api.caddy.courses`).
caddy_hostname: ""

# The path at which the caddi backend is served.
# This value must either be `/` or not end with a slash (e.g. `/caddy`).
caddy_path_prefix: /

# The caddi backend container image.
#
# TODO: set to the published caddi-backend image, or enable self_build below once P3X-118/caddi-backend exists.
caddy_container_image: ""
caddy_container_image_force_pull: "{{ caddy_container_image.endswith(':latest') }}"

caddy_container_image_self_build: false
caddy_container_image_self_build_name: "p3x-118/caddi-backend:{{ caddy_container_image_self_build_repo_version }}"
caddy_container_image_self_build_repo: "https://github.com/P3X-118/caddi-backend.git"  # TODO: repo does not exist yet
caddy_container_image_self_build_repo_version: main
caddy_container_image_self_build_src_files_path: "{{ caddy_base_path }}/docker-src"

# The base container network. It will be auto-created by this role if it doesn't exist already.
caddy_container_network: "{{ caddy_identifier }}"

# Control if the container network is deleted on uninstalling.
caddy_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `caddy_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8080"), or empty string to not expose.
caddy_container_http_host_bind_port: ""

# The port number in the container (the backend's HTTP listen port).
# TODO: confirm the backend's actual listen port once the caddi-backend image exists.
caddy_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
caddy_container_additional_networks: "{{ caddy_container_additional_networks_auto + caddy_container_additional_networks_custom }}"
caddy_container_additional_networks_auto: []
caddy_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
caddy_container_additional_volumes: "{{ caddy_container_additional_volumes_auto + caddy_container_additional_volumes_custom }}"
caddy_container_additional_volumes_auto: []
caddy_container_additional_volumes_custom: []

# caddy_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `caddy_container_labels_additional_labels_custom`.
caddy_container_labels_traefik_enabled: true
caddy_container_labels_traefik_docker_network: "{{ caddy_container_network }}"
caddy_container_labels_traefik_hostname: "{{ caddy_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/caddy`).
caddy_container_labels_traefik_path_prefix: "{{ caddy_path_prefix }}"
caddy_container_labels_traefik_rule: "Host(`{{ caddy_container_labels_traefik_hostname }}`){% if caddy_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ caddy_container_labels_traefik_path_prefix }}`){% endif %}"
caddy_container_labels_traefik_priority: 0
# On the caddy.courses host Traefik runs HTTP-only behind a Cloudflare Tunnel,
# so the host group_vars overrides entrypoints to `web` (which auto-disables tls).
caddy_container_labels_traefik_entrypoints: web-secure
caddy_container_labels_traefik_tls: "{{ caddy_container_labels_traefik_entrypoints != 'web' }}"
caddy_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `caddy_container_labels_traefik_additional_request_headers_custom`
caddy_container_labels_traefik_additional_request_headers: "{{ caddy_container_labels_traefik_additional_request_headers_auto | combine(caddy_container_labels_traefik_additional_request_headers_custom) }}"
caddy_container_labels_traefik_additional_request_headers_auto: {}
caddy_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `caddy_container_labels_traefik_additional_response_headers_custom`
caddy_container_labels_traefik_additional_response_headers: "{{ caddy_container_labels_traefik_additional_response_headers_auto | combine(caddy_container_labels_traefik_additional_response_headers_custom) }}"
caddy_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': caddy_http_header_xss_protection} if caddy_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': caddy_http_header_content_type_options} if caddy_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': caddy_http_header_content_security_policy} if caddy_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': caddy_http_header_permissions_policy} if caddy_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': caddy_http_header_strict_transport_security} if caddy_http_header_strict_transport_security and caddy_container_labels_traefik_tls else {})
  }}
caddy_container_labels_traefik_additional_response_headers_custom: {}

# caddy_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `caddy_container_labels_additional_labels_custom`
#
# Example:
# caddy_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
caddy_container_labels_additional_labels: "{{ caddy_container_labels_additional_labels_auto + caddy_container_labels_additional_labels_custom }}"
caddy_container_labels_additional_labels_auto: []
caddy_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
caddy_container_extra_arguments: "{{ caddy_container_extra_arguments_auto + caddy_container_extra_arguments_custom }}"
caddy_container_extra_arguments_auto: []
caddy_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
caddy_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
caddy_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
caddy_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
caddy_http_header_permissions_policy: "{{ 'interest-cohort=()' if caddy_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
caddy_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if caddy_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `caddy_http_header_permissions_policy`
caddy_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `caddy_http_header_strict_transport_security`
caddy_hsts_preload_enabled: false

# List of systemd services that the caddi backend systemd service depends on
caddy_systemd_required_services_list: "{{ caddy_systemd_required_services_list_default + caddy_systemd_required_services_list_auto + caddy_systemd_required_services_list_custom }}"
caddy_systemd_required_services_list_default: "{{ [sysd_docker_service] if sysd_docker_service else [] }}"
caddy_systemd_required_services_list_auto: []
caddy_systemd_required_services_list_custom: []

# List of systemd services that the caddi backend systemd service wants
caddy_systemd_wanted_services_list: "{{ caddy_systemd_wanted_services_list_default + caddy_systemd_wanted_services_list_auto + caddy_systemd_wanted_services_list_custom }}"
caddy_systemd_wanted_services_list_default: []
caddy_systemd_wanted_services_list_auto: []
caddy_systemd_wanted_services_list_custom: []

# Specify database configuration.
# The SGC group_vars derives these (name/username/derived password) for the host.
caddy_database_hostname: ""
caddy_database_port: 5432
caddy_database_username: caddy
caddy_database_password: ""
caddy_database_name: caddy
caddy_database_sslmode: disable
caddy_environment_variables_database_url: postgres://{{ caddy_database_username }}:{{ caddy_database_password }}@{{ caddy_database_hostname }}:{{ caddy_database_port }}/{{ caddy_database_name }}?sslmode={{ caddy_database_sslmode }}

# Specify the timezone
caddy_environment_variables_tz: UTC

# The public base URL at which the backend is reachable (used for OIDC callbacks, etc.).
caddy_environment_variables_base_url: "{{ caddy_scheme }}://{{ caddy_hostname }}"

# Specify a random string used for session/JWT signing.
# generated with `pwgen -s 64 1` or in another way.
caddy_environment_variables_jwt_secret: ""

# LLM provider chain (dex -> Claude -> user model).
# dex = LocalAI on the Jetson `hal`, OpenAI-compatible, reached from infra at the LAN IP.
caddy_environment_variables_dex_base_url: "http://10.20.0.55:8081"
# TODO: pin the dex model for this workload once the backend exists (keep one model warm; see CLAUDE.md).
caddy_environment_variables_dex_model: ""
# Claude fallback API key (leave empty to disable the Claude fallback).
caddy_environment_variables_anthropic_api_key: ""

# LocalRecall RAG (per-user course-memory collections).
# TODO: set to the LocalRecall REST base (e.g. http://host:8080/api) once deployed.
caddy_environment_variables_localrecall_base_url: ""

# authentik OIDC (the backend is the confidential client; mobile uses the PKCE pattern).
caddy_environment_variables_oidc_issuer: "https://auth.caddy.courses/application/o/caddy/"
caddy_environment_variables_oidc_client_id: caddy
caddy_environment_variables_oidc_client_secret: ""

# Additional environment variables.
caddy_environment_variables_additional_variables: ""

# caddy_restart_necessary controls whether the caddi backend systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
caddy_restart_necessary: false
