---
- name: Fail if required caddi backend settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - caddy_uid
    - caddy_gid
    - caddy_hostname
    - caddy_path_prefix
    - caddy_container_network
    - caddy_database_hostname
    - caddy_database_password
    - caddy_environment_variables_jwt_secret

- name: Fail if no caddi backend container image source is chosen
  ansible.builtin.fail:
    msg: >-
      You must choose a caddi backend container image source: either set `caddy_container_image`
      to a published image, or set `caddy_container_image_self_build: true` (with
      `caddy_container_image_self_build_repo`). NOTE: the backend image/repo (P3X-118/caddi-backend)
      does not exist yet — see the TODO in `defaults/main.yml`.
  when: "(caddy_container_image | default('') | string | length == 0) and not (caddy_container_image_self_build | bool)"

- name: Run if Traefik is enabled
  when: caddy_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for caddi backend are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - caddy_container_labels_traefik_hostname
        - caddy_container_labels_traefik_path_prefix

    - name: Fail if caddy_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          caddy_container_labels_traefik_path_prefix (`{{ caddy_container_labels_traefik_path_prefix }}`) must be `/`.
          The caddi backend does not support hosting under a subpath yet.
      when: "caddy_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `caddy_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if caddy_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          caddy_container_labels_traefik_path_prefix (`{{ caddy_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/caddy`).
      when: "caddy_container_labels_traefik_path_prefix != '/' and caddy_container_labels_traefik_path_prefix[-1] == '/'"
