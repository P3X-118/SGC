---
# hls_relay -- install + manage one ffmpeg HLS-pull-RTMP-push relay unit.

- name: Ensure ffmpeg is available
  ansible.builtin.command: /usr/bin/ffmpeg -version
  register: hls_relay_ffmpeg_check
  changed_when: false
  failed_when: hls_relay_ffmpeg_check.rc != 0
  when: hls_relay_enabled | bool

- name: Render the systemd unit
  ansible.builtin.template:
    src: hls_relay.service.j2
    dest: "/etc/systemd/system/{{ hls_relay_identifier }}.service"
    owner: root
    group: root
    mode: '0644'
  when: hls_relay_enabled | bool
  notify: reload systemd

- name: Ensure the relay is enabled and running
  ansible.builtin.systemd:
    name: "{{ hls_relay_identifier }}.service"
    state: started
    enabled: true
    daemon_reload: true
  when: hls_relay_enabled | bool

- name: Remove the systemd unit when disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ hls_relay_identifier }}.service"
    state: absent
  when: not (hls_relay_enabled | bool)
  notify: reload systemd

- name: Stop the relay when disabled
  ansible.builtin.systemd:
    name: "{{ hls_relay_identifier }}.service"
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false
  when: not (hls_relay_enabled | bool)
