    # Local-only role at roles/mash/texasmodern_signup/.
    # Owns the docker-compose project on the tmw EC2 that backs
    # texasmodern-signup.eagledrive.live (Caddy + web + api + db +
    # Authentik proxy outpost). Server-side Authentik provisioning
    # for this app lives on bskypds.pro (texasmodern_authentik_*).
    - when: texasmodern_signup_enabled | bool
      role: mash/texasmodern_signup
    # /role-specific:texasmodern_signup

    # role-specific:peertube_lockdown
    # Headless-PeerTube settings layer: contributes PEERTUBE_* env vars and a
    # Traefik block-router into the galaxy/peertube role's inputs. Must run
    # BEFORE galaxy/peertube so its set_fact mutations are visible when the
    # main role renders env + labels. No-op unless peertube_lockdown_enabled.
    - when: peertube_lockdown_enabled | default(false) | bool
      role: mash/peertube_lockdown
      tags: [setup-all, setup-peertube, setup-peertube_lockdown, install-all, install-peertube, install-peertube_lockdown]
    # /role-specific:peertube_lockdown

    # role-specific:peertube
    - role: galaxy/peertube
    # /role-specific:peertube

    # role-specific:peertube_roster
    # Local layer on top of galaxy/peertube: ensures the ghostrak-roster
    # service account, raised channel limit, and mp4 transcoding (coaching
    # platform prerequisites). No-op unless peertube_roster_enabled.
    - when: peertube_roster_enabled | default(false) | bool
      role: mash/peertube_roster
    # /role-specific:peertube_roster

    # role-specific:peertube_oidc
    # Local layer on top of galaxy/peertube: installs + configures the
    # auth-openid-connect plugin so the instance federates into our shared
    # Authentik (unified accounts). No-op unless peertube_oidc_enabled.
    - when: peertube_oidc_enabled | default(false) | bool
      role: mash/peertube_oidc
    # /role-specific:peertube_oidc

    # role-specific:peertube_branding
    # Local layer on top of galaxy/peertube: applies ghostrak instance
    # branding (name, theme colors, custom CSS, avatar) via PeerTube's API.
    # No-op unless peertube_branding_enabled.
    - when: peertube_branding_enabled | default(false) | bool
      role: mash/peertube_branding
    # /role-specific:peertube_branding

    # role-specific:peertube_tiers
    # Local layer on top of galaxy/peertube: installs + configures
    # peertube-plugin-ghostrak-tiers (role-tiered, hard-isolated video access).
    # No-op unless peertube_tiers_enabled.
    - when: peertube_tiers_enabled | default(false) | bool
      role: mash/peertube_tiers
